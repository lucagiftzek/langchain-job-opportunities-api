[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-job-opportunities-api"
version = "0.1.0"
description = "LangChain tools for Job Opportunities API: live job postings straight from employers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Loukas Tzekos", email = "hello@jobopportunitiesapi.org" }]
keywords = ["langchain", "jobs", "job-postings", "recruitment", "labour-market", "rag"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain-core>=0.3.0",
  "requests>=2.28",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://jobopportunitiesapi.org"
Documentation = "https://jobopportunitiesapi.org/api"
Source = "https://github.com/lucagiftzek/langchain-job-opportunities-api"

[tool.hatch.build.targets.wheel]
packages = ["langchain_job_opportunities_api"]
